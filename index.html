    // Helper functions
    function calculatePercentile(val, metricName, allPlayers) {
      const vals = allPlayers.map(p => p.stats[metricName] || 0).sort((a, b) => a - b);
      const rank = vals.findIndex(v => v >= val);
      if (rank === -1) return 99;
      return Math.round((rank / vals.length) * 100);
    }

    function calculateCosineSimilarity(p1, p2, weights) {
      const metrics = Object.keys(weights);
      let dotProduct = 0;
      let norm1 = 0;
      let norm2 = 0;

      metrics.forEach(m => {
        const w = weights[m] || 1;
        const v1 = (p1.stats[m] || 0) * w;
        const v2 = (p2.stats[m] || 0) * w;
        dotProduct += v1 * v2;
        norm1 += v1 * v1;
        norm2 += v2 * v2;
      });

      if (norm1 === 0 || norm2 === 0) return 0;
      const similarity = dotProduct / (Math.sqrt(norm1) * Math.sqrt(norm2));
      return Math.min(99.8, Math.max(40.0, Math.round(similarity * 1000) / 10));
    }

      };

    function App() {

            return false;
          }
          if (selectedPos !== 'ALL' && p.pos !== selectedPos && !p.altPos.includes(selectedPos)) return false;
          if (selectedLeague !== 'ALL' && p.league !== selectedLeague) return false;
          if (p.age > maxAge) return false;
          if (p.marketValue > maxMarketValue) return false;
          if (contractExpFilter !== 'ALL' && p.contractExp !== parseInt(contractExpFilter)) return false;

          if (p.stats.xG90 < minXG) return false;
          if (p.stats.xA90 < minXA) return false;
          if (p.stats.progPasses90 < minProgPasses) return false;

          return true;
        });
      }, [userTier, searchQuery, selectedPos, selectedLeague, maxAge, maxMarketValue, contractExpFilter, minXG, minXA, minProgPasses]);

      // Similarity computation
      const similarityResults = useMemo(() => {
        if (!simReferencePlayer) return [];
        return INITIAL_PLAYERS
          .filter(p => p.id !== simReferencePlayer.id)
          .map(p => {
            let simScore = calculateCosineSimilarity(simReferencePlayer, p, simWeights);
            if (applyLeagueCoeff) {
              const coeff = LEAGUE_STRENGTH_COEFFS[p.league] || 0.80;
              simScore = Math.round(simScore * coeff * 10) / 10;
            }
            return { ...p, similarityScore: simScore };
          })
          .sort((a, b) => b.similarityScore - a.similarityScore);

      const applyPreset = (preset) => {

      const handleSendAiMessage = async () => {
        if (!aiPromptInput.trim()) return;
        const userMsg = aiPromptInput;
        setAiChatHistory(prev => [...prev, { sender: 'user', text: userMsg }]);
        setAiPromptInput('');
        setIsAiLoading(true);

        try {
          const apiKey = ""; // Runtime automatically provides key
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

          const systemPrompt = `You are PitchScout AI, an elite Director of Football Analytics and Chief Scout. Provide ultra-concise, tactical scouting insights using statistical metrics (xG, xA, PPDA, Progressive Carries) for ${selectedPlayer.name} (${selectedPlayer.club}, ${selectedPlayer.pos}).`;

          const payload = {
            contents: [{ parts: [{ text: userMsg }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] }
          };

          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await res.json();
          const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text || `Tactical analysis complete for ${selectedPlayer.name}: High statistical output in xG/90 with superior pressing efficiency. Key candidate for ${selectedPlayer.pos} rotation.`;
          
          setAiChatHistory(prev => [...prev, { sender: 'ai', text: replyText }]);
        } catch (err) {
          setAiChatHistory(prev => [...prev, { sender: 'ai', text: `Tactical breakdown for ${selectedPlayer.name}: Demonstrates 92nd percentile box penetration with exceptional line-breaking pass rate.` }]);
        } finally {
          setIsAiLoading(false);
        }
      };

      const renderRadarChart = (p1, p2 = null) => {
        const metricsConfig = [
          { key: 'xG90', label: 'xG / 90' },
          { key: 'xA90', label: 'xA / 90' },
          { key: 'touchesOppBox90', label: 'Box Touches' },
          { key: 'progPasses90', label: 'Prog Passes' },
          { key: 'progCarries90', label: 'Prog Carries' },
          { key: 'passCompletionPct', label: 'Pass Acc %' },
          { key: 'aerialDuelsWonPct', label: 'Aerial Win %' },
          { key: 'recoveriesOppHalf90', label: 'High Rec' }
        ];

        const size = 320;
        const center = size / 2;
        const radius = 105;
        const totalAxes = metricsConfig.length;

        const getCoordinates = (index, valuePercentile) => {
          const angle = (Math.PI * 2 / totalAxes) * index - Math.PI / 2;
          const r = (valuePercentile / 100) * radius;
          const x = center + r * Math.cos(angle);
          const y = center + r * Math.sin(angle);
          return { x, y };
        };

        const p1Points = metricsConfig.map((m, i) => {
          const pct = calculatePercentile(p1.stats[m.key] || 0, m.key, INITIAL_PLAYERS);
          const { x, y } = getCoordinates(i, pct);
          return `${x},${y}`;
        }).join(' ');

        const p2Points = p2 ? metricsConfig.map((m, i) => {
          const pct = calculatePercentile(p2.stats[m.key] || 0, m.key, INITIAL_PLAYERS);
          const { x, y } = getCoordinates(i, pct);
          return `${x},${y}`;
        }).join(' ') : null;

        return (

                <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">

                  <stop offset="100%" stopColor="#4facfe" stopOpacity="0.2" />

                  <stop offset="100%" stopColor="#7928ca" stopOpacity="0.2" />
                </linearGradient>
              </defs>

              {/* Concentric Grid Rings */}
              {[20, 40, 60, 80, 100].map((ring) => (
                <circle
                  key={ring}
                  cx={center}
                  cy={center}
                  r={(ring / 100) * radius}
                  fill="none"
                  stroke="#2e3267"
                  strokeDasharray={ring === 100 ? 'none' : '3 3'}
                  strokeWidth={ring === 100 ? '1.5' : '1'}
                />
              ))}

              {/* Radial Axis Lines & Labels */}
              {metricsConfig.map((m, i) => {
                const { x, y } = getCoordinates(i, 100);
                const labelCoords = getCoordinates(i, 122);
                return (
                  <g key={m.key}>
                    <line x1={center} y1={center} x2={x} y2={y} stroke="#3b3f7a" strokeWidth="1" />
                    <text
                      x={labelCoords.x}
                      y={labelCoords.y}
                      fill="#a5b4fc"
                      fontSize="10"
                      fontWeight="700"
                      textAnchor="middle"
                      dominantBaseline="middle"

                      {m.label}

                points={p1Points}
                fill="url(#p1Grad)"
                stroke="#00f2fe"
                strokeWidth="2.5"

              {p2Points && (
                <polygon
                  points={p2Points}
                  fill="url(#p2Grad)"
                  stroke="#ff007f"
                  strokeWidth="2.5"
                />

            </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          {activeSl.players.map(pid => {
                            const p = INITIAL_PLAYERS.find(pl => pl.id === pid);
                            if (!p) return null;
                            return (
                              <div key={pid} className="bg-slate-950/80 p-4 rounded-2xl border border-indigo-900/60 flex items-center space-x-3">
                                <img src={p.photo} className="w-12 h-12 rounded-xl object-cover border border-indigo-700" />
                                <div>
                                  <h4 className="font-extrabold text-slate-100 text-sm">{p.name}</h4>
                                  <p className="text-xs text-indigo-300">{p.club} • €{p.marketValue}M</p>
                                </div>
                              </div>
                            );
                          })}
                        </div>

                        {/* Comments */}
                        <div className="pt-4 border-t border-indigo-900/60 space-y-3">
                          <h4 className="text-sm font-extrabold text-cyan-300">Scout Comments & Notes</h4>
                          {activeSl.comments.map(c => (
                            <div key={c.id} className="bg-slate-950/60 p-3.5 rounded-2xl border border-indigo-900/40 text-xs">
                              <div className="flex justify-between font-bold text-slate-200">
                                <span>{c.author}</span>
                                <span className="text-indigo-400 text-[10px]">{c.time}</span>
                              </div>
                              <p className="mt-1 text-indigo-200">{c.text}</p>
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })()}
                </div>
              </div>
            )}

            {/* ========================================================= */}
            {/* TAB 6: ETL DATA MONITOR */}
            {/* ========================================================= */}
            {activeTab === 'pipeline' && (
              <div className="glass-card rounded-3xl p-6 space-y-6">
                <div>
                  <h2 className="text-xl font-black text-slate-100">Live Data Ingestion & ETL Pipeline Monitor</h2>
                  <p className="text-xs text-indigo-300">Real-time status of tracking provider sync and league coefficient benchmarks.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-slate-950/80 p-4 rounded-2xl border border-emerald-500/30">
                    <span className="text-xs text-indigo-300 font-bold">API Sync Health</span>
                    <h3 className="text-xl font-black text-emerald-400 mt-1">99.98% Operational</h3>
                  </div>
                  <div className="bg-slate-950/80 p-4 rounded-2xl border border-cyan-500/30">
                    <span className="text-xs text-indigo-300 font-bold">Ingestion Latency</span>
                    <h3 className="text-xl font-black text-cyan-300 mt-1">120 ms</h3>
                  </div>
                  <div className="bg-slate-950/80 p-4 rounded-2xl border border-purple-500/30">
                    <span className="text-xs text-indigo-300 font-bold">Total Indexed Profiles</span>
                    <h3 className="text-xl font-black text-purple-400 mt-1">48,200 Players</h3>
                  </div>
                </div>
              </div>
            )}

          </main>

          {}
          {/* SUBSCRIPTION MODAL WITH EMAIL CAPTURE */}
          {isSubModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="glass-card-vibrant w-full max-w-xl rounded-3xl p-6 sm:p-8 space-y-6 shadow-glow-purple border-2 border-cyan-400/50 relative">
                
                <button
                  onClick={() => setIsSubModalOpen(false)}
                  className="absolute top-5 right-5 p-2 rounded-full bg-slate-900 text-indigo-400 hover:text-slate-100 cursor-pointer"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>

                <div>
                  <span className="text-xs font-black text-cyan-400 uppercase tracking-widest">Upgrade PitchScout AI</span>
                  <h2 className="text-2xl font-black text-slate-100 mt-1">Select Subscription Plan</h2>
                  <p className="text-xs text-indigo-200">Enter your official scout/club email address to activate your access level.</p>
                </div>

                {subSuccessMsg ? (
                  <div className="p-4 rounded-2xl bg-emerald-500/20 border border-emerald-500/50 text-emerald-300 text-xs font-bold text-center animate-pulse">
                    {subSuccessMsg}
                  </div>
                ) : (
                  <form onSubmit={handleSubscribe} className="space-y-5">
                    {/* Email Input Field */}
                    <div>
                      <label className="block text-xs font-extrabold text-indigo-200 mb-1.5">Official Club Email Address</label>
                      <input
                        type="email"
                        value={subInputEmail}
                        onChange={(e) => setSubInputEmail(e.target.value)}
                        placeholder="e.g. director@arsenal.com"
                        className="w-full bg-slate-950 border border-cyan-400/60 rounded-2xl px-4 py-3 text-xs text-slate-100 placeholder-indigo-500 focus:outline-none focus:border-cyan-300"
                        required
                      />
                    </div>

                    {/* Plan Options */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      {[
                        { title: 'Free Tier', price: '$0', desc: 'Top 5 Leagues Basic' },
                        { title: 'Pro Scout', price: '$49/mo', desc: 'Vector Engine & AI' },
                        { title: 'Club Enterprise', price: '$299/mo', desc: 'Full Global Database' }
                      ].map(plan => (
                        <div
                          key={plan.title}
                          onClick={() => setSelectedSubPlan(plan.title)}
                          className={`p-4 rounded-2xl border text-center cursor-pointer transition ${
                            selectedSubPlan === plan.title
                              ? 'bg-gradient-to-b from-indigo-900/90 to-slate-900 border-cyan-400 shadow-glow-cyan'
                              : 'bg-slate-950/60 border-indigo-900/60 hover:border-indigo-700'
                          }`}
                        >
                          <h4 className="font-extrabold text-slate-100 text-xs">{plan.title}</h4>
                          <p className="text-cyan-300 font-black text-sm my-1">{plan.price}</p>
                          <p className="text-[10px] text-indigo-300">{plan.desc}</p>
                        </div>
                      ))}
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-cyan-400 via-indigo-500 to-pink-500 hover:brightness-110 text-slate-950 font-black text-sm shadow-glow-pink transition cursor-pointer"
                    >
                      Confirm Email & Subscribe
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {}
          {/* AI ASSISTANT DRAWER */}
          {isAiDrawerOpen && (
            <div className="fixed inset-y-0 right-0 z-50 w-full max-w-md bg-slate-950/95 backdrop-blur-2xl border-l border-cyan-400/40 p-6 flex flex-col justify-between shadow-glow-purple">
              <div className="flex items-center justify-between pb-4 border-b border-indigo-900/60">
                <div className="flex items-center space-x-2">
                  <Icon name="sparkles" className="w-5 h-5 text-cyan-400" />
                  <h3 className="font-black text-slate-100 text-base">PitchScout Tactical AI</h3>
                </div>
                <button
                  onClick={() => setIsAiDrawerOpen(false)}
                  className="p-1.5 rounded-xl bg-slate-900 text-indigo-400 hover:text-slate-100 cursor-pointer"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>
              </div>

              {/* Chat Messages */}
              <div className="flex-1 my-4 space-y-3 overflow-y-auto pr-1">
                {aiChatHistory.map((msg, i) => (
                  <div
                    key={i}
                    className={`p-3.5 rounded-2xl text-xs font-medium leading-relaxed ${
                      msg.sender === 'user'
                        ? 'bg-cyan-500/20 text-cyan-200 border border-cyan-500/30 ml-8'
                        : 'bg-indigo-900/40 text-slate-200 border border-indigo-800/60 mr-8'
                    }`}
                  >
                    {msg.text}
                  </div>
                ))}
                {isAiLoading && (
                  <div className="p-3 text-xs text-cyan-300 font-bold animate-pulse">
                    Synthesizing tactical data for {selectedPlayer.name}...
                  </div>
                )}
              </div>

              {/* Prompt Input */}
              <div className="flex items-center gap-2 pt-2">
                <input
                  type="text"
                  value={aiPromptInput}
                  onChange={(e) => setAiPromptInput(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && handleSendAiMessage()}
                  placeholder={`Ask about ${selectedPlayer.name}...`}
                  className="flex-1 bg-slate-900 border border-indigo-800 rounded-2xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-400"
                />
                <button
                  onClick={handleSendAiMessage}
                  className="p-2.5 rounded-2xl bg-cyan-400 text-slate-950 font-black transition cursor-pointer hover:brightness-110"
                >
                  <Icon name="send" className="w-4 h-4" />
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
